{% extends 'base.html' %}

{% block title %}
Delete Doctor
{% endblock %}
{% block content %}

<h2>Delete Doctor</h2>
<p> Are you sure you want to delete <strong>{{ doctor.name }}</strong>?</p>
<form method="POST">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes,Delete</button>
    <a href="{% url 'doctor_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
