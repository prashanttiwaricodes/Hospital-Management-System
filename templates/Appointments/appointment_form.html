{% extends 'base.html' %}
{% block title %}
Add Appointment
{% endblock %}
{% block content %}

<h2 class="mb-4">Add Appointment</h2>
<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class=" btn btn-success btn-sm">Save</button>
    <a href="{% url 'appointment_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
