{% extends 'base.html' %}
{% block title %}
Billing Form
{% endblock %}
{% block content %}
<h2 class="mb-4">Add Bills</h2>
<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
   <button type="submit" class="btn btn-success btn-sm">Save</button> 
   <a href="{% url 'bills_list' %}" class="btn btn-secondary btn-sm">Cancel</a>
</form>
{% endblock %}
